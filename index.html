
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Vampire Lucky Spin</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10091c;color:white;
 font-family:Arial,sans-serif;text-align:center;
 padding:25px 15px;
}
h1{color:#c084fc;font-size:27px}
.subtitle{color:#d8b4fe}
.mascot{font-size:65px;margin:15px}
.points{background:#29143f;padding:13px;border-radius:15px;
 margin:20px auto;max-width:300px;color:#facc15}
.pointer{font-size:35px;color:#facc15;margin-bottom:-10px}
.wheel{
 width:280px;height:280px;max-width:85vw;max-height:85vw;
 border-radius:50%;margin:auto;
 border:8px solid #d8b4fe;
 background:conic-gradient(
 #dc2626 0deg 27.692deg,
 #7e22ce 27.692deg 55.385deg,
 #dc2626 55.385deg 83.077deg,
 #7e22ce 83.077deg 110.769deg,
 #dc2626 110.769deg 138.462deg,
 #7e22ce 138.462deg 166.154deg,
 #dc2626 166.154deg 193.846deg,
 #7e22ce 193.846deg 221.538deg,
 #dc2626 221.538deg 249.231deg,
 #7e22ce 249.231deg 276.923deg,
 #dc2626 276.923deg 304.615deg,
 #7e22ce 304.615deg 332.308deg,
 #dc2626 332.308deg 360deg
);
 position:relative;
 transition:transform 4s cubic-bezier(.12,.7,.12,1);
 box-shadow:0 0 25px #a855f7;
}
.wheel span{
 position:absolute;left:50%;top:50%;
 font-size:19px;font-weight:bold;
 transform-origin:0 0;
} 
.wheel span.zero{
  background:#b91c1c;
  border:2px solid white;
  border-radius:50%;
  padding:3px;
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  font-size:14px;
  box-shadow:0 0 7px #ff3333;
}
.center{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 background:#170c28;border:4px solid gold;
 border-radius:50%;width:65px;height:65px;
 display:grid;place-items:center;font-size:28px;
}
button{
 background:#9333ea;color:white;border:0;
 padding:15px 35px;border-radius:30px;
 font-size:18px;font-weight:bold;margin:20px;
}
button:disabled{opacity:.5}
#result{font-size:21px;color:#facc15;min-height:30px}
.note{font-size:12px;color:#bda9cf}
</style>
</head>
<body>

<h1>🧛 MIDNIGHT VAMPIRE</h1>
<div class="subtitle">LUCKY SPIN</div>
<div class="mascot">🐊</div>

<div class="points">
 ⭐ YOUR POINTS: <b id="points">100</b>
</div>

<div style="
background:#42204f;
color:#facc15;
padding:15px;
border-radius:15px;
margin:12px auto;
max-width:300px;
font-size:22px;
font-weight:bold;">
🎯 BET: 10 COINS
</div>
 
<div class="pointer">▼</div>

<div class="wheel" id="wheel">

<span style="transform:rotate(13.846deg) translateY(-112px)">0</span>
<span style="transform:rotate(41.538deg) translateY(-112px)">10</span>
<span style="transform:rotate(69.231deg) translateY(-112px)">0</span>
<span style="transform:rotate(96.923deg) translateY(-112px)">20</span>
<span style="transform:rotate(124.615deg) translateY(-112px)">0</span>
<span style="transform:rotate(152.308deg) translateY(-112px)">50</span>
<span style="transform:rotate(180deg) translateY(-112px)">0</span>
<span style="transform:rotate(207.692deg) translateY(-112px)">5</span>
<span style="transform:rotate(235.385deg) translateY(-112px)">0</span>
<span style="transform:rotate(263.077deg) translateY(-112px)">30</span>
<span style="transform:rotate(290.769deg) translateY(-112px)">0</span>
<span style="transform:rotate(318.462deg) translateY(-112px)">100</span>

 
<div class="center">🐊</div>
</div>

<button id="spin" onclick="spin()">🎡 SPIN NOW</button>
<div id="result">Good luck, vampire!</div>

<p class="note">FREE DEMO GAME • VIRTUAL POINTS ONLY</p>

<script>
let points=100;
let rotation=0;
let busy=false;
let audio;
let soundTimer;
let tickCount=0;

function tickSound(){
 if(!audio) return;

 let osc=audio.createOscillator();
 let gain=audio.createGain();

 osc.type="square";
 osc.frequency.value=900;
 gain.gain.value=0.045;

 osc.connect(gain);
 gain.connect(audio.destination);

 osc.start();
 osc.stop(audio.currentTime+0.035);
}

function winSound(){
 if(!audio) return;

 [523,659,784,1046].forEach((freq,i)=>{
  let osc=audio.createOscillator();
  let gain=audio.createGain();

  osc.type="sine";
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.12,audio.currentTime+i*0.13);
  gain.gain.exponentialRampToValueAtTime(
   0.001,audio.currentTime+i*0.13+0.35
  );

  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start(audio.currentTime+i*0.13);
  osc.stop(audio.currentTime+i*0.13+0.35);
 });
}

function spin(){
 if(busy)return;

 if(points<10){
  document.getElementById("result").textContent="Not enough points!";
  return;
 }

 busy=true;
 points-=10;
 document.getElementById("points").textContent=points;
 document.getElementById("spin").disabled=true;

 if(!audio){
  audio=new (window.AudioContext||window.webkitAudioContext)();
 }
 audio.resume();

 let prizes=[0,10,0,20,0,50,0,5,0,30,0,100];
 let index=Math.floor(Math.random()*prizes.length);
 let prize=prizes[index];

 rotation+=1440+(330-index*60-rotation%360+720)%360;

 document.getElementById("wheel").style.transform=
 "rotate("+rotation+"deg)";

 let start=Date.now();
 let target=(360-(index+0.5)*360/13+360)%360;

rotation+=1440+(target-rotation%360+360)%360;

 function playTicks(){
  let elapsed=Date.now()-start;
  if(elapsed>=duration)return;

  tickSound();

  let progress=elapsed/duration;
  let delay=65+progress*260;

  soundTimer=setTimeout(playTicks,delay);
 }

 playTicks();

 setTimeout(()=>{
  clearTimeout(soundTimer);
  winSound();

  points+=prize;
  document.getElementById("points").textContent=points;
  document.getElementById("result").textContent=
  "🐊 YOU WON "+prize+" POINTS!";

  document.getElementById("spin").disabled=false;
  busy=false;
 },4100);
}
</script>
 
</body>
</html>
